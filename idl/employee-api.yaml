openapi : 3.0.3
info :
  title : Zero consult employee - OpenAPI 3.2
  description : ''
  version : 1.0.0
paths:
  /employees :
    get :
      tags :
        - employee
      summary : Get the list of employees
      operationId : employeesList
      responses :
        '200' :
          description : A list of employees
          content :
            application/json :
              schema :
                type : array
                items :
                  $ref : '#/components/schemas/Employee'
components :
  schemas :
    Department :
      type : string
      enum : ["Engineering", "Design", "Marketing", "HR", "Finance", "Operations"]
    Employee :
      type : object
      properties :
        department :
          $ref : '#/components/schemas/Department'
        email :
          type : string
        firstName :
          type : string
        functionTitle :
          type : string
        id :
          type : string
        lastName :
          type : string
        phone :
          type : string
        startDate :
          type : integer
          format : int64
        status :
          $ref : '#/components/schemas/EmployeeStatus'
    EmployeeStatus :
      type : string
      enum : ["Active", "Inactive", "On leave"]
